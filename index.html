<style>
/* Layout: one narrow reading column (phone first) — sticky brand bar, hero card, level bands with tap-to-reveal answers, archive at the bottom */
:root{
  --bg:#fbf8f4; --surface:#ffffff; --ink:#2b2d42; --muted:#6b6f80; --navy:#2b2d6e; --pink:#e0457b; --gold:#f2c14e; --gold-soft:#fff7df; --line:#e6e3ee;
  --hero-a:#fff3e3; --hero-b:#f3ecfb; --src:#8a6d1f;
  --l1:#2fa865; --l2:#2a92cf; --l3:#e8901a; --l4:#8c5fd0; --l5:#d9467a;
  --f-ui:"Rubik","Segoe UI",Arial,sans-serif; --f-verse:"Frank Ruhl Libre","David","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17162a; --surface:#221f38; --ink:#ecebf5; --muted:#a7a6bd; --navy:#c9c6ff; --pink:#ff7aa6; --gold:#e6b947; --gold-soft:#3a3222; --line:#35325a;
  --hero-a:#2b2440; --hero-b:#2a2147; --src:#e2c37a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17162a; --surface:#221f38; --ink:#ecebf5; --muted:#a7a6bd; --navy:#c9c6ff; --pink:#ff7aa6; --gold:#e6b947; --gold-soft:#3a3222; --line:#35325a;
  --hero-a:#2b2440; --hero-b:#2a2147; --src:#e2c37a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--l5),var(--l4),var(--l3),var(--l2),var(--l1)) 1}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:38px;height:38px;flex:none;border-radius:50%;display:block}
.bn{font-weight:800;font-size:17px;line-height:1}.bn b{color:var(--navy)}.bn i{font-style:normal;color:var(--pink)}
.tag{display:inline-block;background:var(--gold);color:#3b2a00;font-size:9px;font-weight:800;border-radius:5px;padding:1px 6px;margin-top:3px;letter-spacing:.06em}
.lang{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}

main{display:flex;flex-direction:column;gap:14px;padding-block:16px 40px}

/* hero */
.hero{border:2px dashed var(--gold);border-radius:20px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));text-align:center;padding:18px 14px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.series{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.series b{color:var(--pink)}
.kicker{font-weight:700;color:var(--navy);font-size:15px}
h1{margin:0;font-size:clamp(30px,8.5vw,44px);line-height:1.1;font-weight:900;color:var(--navy);text-wrap:balance}
h1 em{font-style:normal;color:var(--pink)}
.emo{font-size:22px;letter-spacing:4px;line-height:1.4}
.sub{color:var(--muted);font-size:15px}
.oldnote{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:15px}
.oldnote button{border:0;background:var(--navy);color:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}

/* download */
.dl{display:none;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
body.can-dl .dl{display:flex}
.dl h2{margin:0;font-size:17px;color:var(--navy)}
.dl p{margin:0;font-size:14px;color:var(--muted)}
.dlrow{display:flex;gap:8px;flex-wrap:wrap}
.dlrow>*{flex:1;min-width:130px;border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px;cursor:pointer;background:var(--navy);color:var(--surface);text-align:center;text-decoration:none}
.dlrow>*+*{background:var(--pink)}
.dlrow button:disabled{opacity:.6;cursor:progress}
.dlmsg{font-size:14px;color:var(--muted);min-height:1.2em}

/* WhatsApp community */
.wa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--wa);border-radius:18px;padding:12px 16px}
.wa .wt{flex:1;min-width:190px}
.wa h2{margin:0;font-size:17px;color:var(--navy)}
.wa p{margin:0;font-size:14px;color:var(--muted)}
.wa a{flex:none;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;font-size:15px;border-radius:12px;padding:10px 16px}
:root{--wa:#128c4a}

/* how to play */
.how{background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:12px 16px}
.how summary{font-weight:800;color:var(--pink);font-size:17px;cursor:pointer}
.how ul{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}

/* level nav + tools */
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav button{border:0;border-radius:12px;color:#fff;font-weight:800;font-size:13px;padding:7px 2px;cursor:pointer;line-height:1.2}
.nav small{display:block;font-weight:600;font-size:11px;opacity:.95}
.tools{display:flex;justify-content:flex-end}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--navy)}

/* levels */
.level{display:flex;flex-direction:column;gap:8px;scroll-margin-top:72px}
.lhead{display:flex;align-items:center;gap:12px;color:#fff;border-radius:18px;padding:12px 16px;background:var(--lc)}
.lico{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:20px}
.lname{font-size:20px;font-weight:800;line-height:1.2}
.lage{font-size:13px;opacity:.95}
.stars{margin-inline-start:auto;font-size:13px;white-space:nowrap}

.q{background:color-mix(in srgb,var(--lc) 11%,var(--surface));border-radius:16px;padding:12px 14px;display:flex;gap:12px}
.q.gold{background:linear-gradient(135deg,var(--gold-soft),color-mix(in srgb,var(--l5) 12%,var(--surface)));border:2px solid var(--gold)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lc);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.qb{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.qt{font-weight:600;font-size:17px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts>span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 11px;font-size:15px}
.opts b{color:var(--lc)}
.reveal{align-self:flex-start;border:1.5px solid var(--lc);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;cursor:pointer}
.reveal[aria-expanded="true"]{background:var(--lc);color:#fff}
.ans{background:var(--surface);border-radius:12px;padding:10px 12px;border-inline-start:4px solid var(--lc);font-size:15.5px;line-height:1.55}
.ans b{display:block;color:var(--ink);font-size:16px}
.ans .x{color:var(--muted)}

.he{font-family:var(--f-verse);font-weight:700;font-size:1.14em;color:var(--navy);unicode-bidi:isolate}
.src{font-family:var(--f-verse);font-weight:500;font-size:.86em;color:var(--src);unicode-bidi:isolate;white-space:nowrap}
.gloss{font-style:italic;color:var(--muted);font-weight:500}

.bye{text-align:center;font-size:24px;font-weight:900;color:var(--pink);padding-block:6px}

/* game */
:root{--ok:#2fa865;--ok-ink:#1d7a47;--no:#e5484d;--no-ink:#b3282d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok-ink:#7fe0a8;--no-ink:#ff9a9d}}
:root[data-theme="dark"]{--ok-ink:#7fe0a8;--no-ink:#ff9a9d}
main{padding-bottom:96px}
.tools{align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tools .play{font-weight:800;color:var(--pink);font-size:15px}
.opts.play{flex-direction:column;gap:7px}
.opt{display:block;width:100%;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:16px;font-weight:600;line-height:1.4;cursor:pointer;transition:transform .12s}
.opt b{color:var(--lc)}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt:disabled:not(.right):not(.wrong){opacity:.5}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--no);border-color:var(--no);color:#fff}
.opt.right b,.opt.wrong b,.opt.right .he,.opt.wrong .he,.opt.right .src,.opt.wrong .src,.opt.right .gloss,.opt.wrong .gloss{color:#fff}
.judge{display:flex;gap:8px;flex-wrap:wrap}
.judge button{flex:1;min-width:120px;border-radius:999px;padding:9px 8px;font-weight:800;font-size:14.5px;white-space:nowrap;cursor:pointer;border:2px solid var(--ok)}
.knew{background:var(--ok);color:#fff}
.didnt{background:var(--surface);border-color:var(--line)!important}
.fb{align-self:flex-start;font-weight:800;font-size:16px;border-radius:12px;padding:5px 12px}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok-ink)}
.fb.no{background:color-mix(in srgb,var(--no) 14%,var(--surface));color:var(--no-ink)}
.chip{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-end:max(14px,env(safe-area-inset-right,0px));border:0;border-radius:999px;padding:9px 16px;background:var(--navy);color:var(--surface);font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(43,45,110,.35);cursor:pointer}
.chip b{font-size:19px;color:var(--gold)}
.chip small{opacity:.8;font-weight:600;margin-inline-start:4px}
.toast{position:fixed;z-index:21;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--pink);color:#fff;font-weight:800;font-size:16px;border-radius:16px;padding:10px 18px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.final{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid var(--gold);border-radius:22px;padding:18px 16px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.final .big{font-size:28px;font-weight:900;color:var(--navy)}
.final .score{font-size:44px;font-weight:900;color:var(--pink);line-height:1}
.final .score small{font-size:20px;color:var(--muted)}
.final p{margin:0;font-size:16px}
.frow{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:6px}
.frow>*{flex:1;min-width:150px;border:0;border-radius:12px;padding:11px 12px;font-weight:800;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.frow .comm{flex-basis:100%;background:var(--gold);color:#3b2a00;font-size:16px}
.frow .share{background:var(--wa);color:#fff}
.fab{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:max(14px,env(safe-area-inset-left,0px));border:0;border-radius:999px;padding:11px 16px;background:var(--gold);color:#3b2a00;font-size:15px;font-weight:800;box-shadow:0 6px 20px rgba(43,45,110,.3);cursor:pointer}
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(20,18,40,.45)}
.sheet{position:fixed;z-index:41;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:var(--surface);border:3px solid var(--gold);border-radius:22px;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet .big{font-size:22px;font-weight:900;color:var(--navy)}
.sheet .score{font-size:34px;font-weight:900;color:var(--pink);line-height:1.1}
.sheet .score small{font-size:17px;color:var(--muted)}
.sheet .x{position:absolute;top:8px;inset-inline-end:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;padding:6px}
.cnote{font-size:14px;font-weight:700;color:var(--ok-ink);min-height:1.2em}
.frow button{background:var(--navy);color:var(--surface)}
.plus,.bit{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%)}
.plus{font-weight:900;font-size:24px;color:var(--ok);text-shadow:0 2px 0 var(--surface);animation:rise 1.1s ease-out forwards}
.bit{font-size:20px;animation:fly 1s ease-out forwards}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.chip.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}

/* archive */
.archive{display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--line);padding-top:18px;margin-top:6px}
.archive h2{margin:0;font-size:20px;color:var(--navy)}
.alist{display:flex;flex-direction:column;gap:8px}
.acard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer}
.acard .no{flex:none;width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--surface);font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.acard .t{font-weight:700;font-size:16px}.acard .d{font-size:13px;color:var(--muted)}
.acard.cur{border-color:var(--pink)}
.acard .pill{margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--pink);white-space:nowrap}
.empty{color:var(--muted);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.load{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (max-width:420px){.nav button{font-size:12px}.lname{font-size:18px}.emo{font-size:19px;letter-spacing:2px}}
</style>

<header class="bar"><div class="wrap">
  <div class="brand"><img class="logo" src="logo.png" alt=""><div><div class="bn"><b>Ouri</b><i>Mad</i></div><span class="tag">WEEKLY_PARASHA</span></div></div>
  <div class="lang" role="group" aria-label="Language / שפה">
    <button id="btn-he" type="button" data-l="he">עברית</button>
    <button id="btn-fr" type="button" data-l="fr">Français</button>
  </div>
</div></header>

<main class="wrap" id="app"><div class="load">טוען… · Chargement…</div></main>

<script>
const LV = [
  {c:"var(--l1)", i:"🌱"}, {c:"var(--l2)", i:"🔍"}, {c:"var(--l3)", i:"🕵️"}, {c:"var(--l4)", i:"🧠"}, {c:"var(--l5)", i:"🏆"}
];
const UI = {
  he:{dir:"rtl", series:"חידון מס׳", parasha:"פרשת", how:"🎲 איך משחקים?", lvl:"שלב", pts:n=>n+" נק׳",
      show:"הצגת התשובה", hide:"הסתרת התשובה", all:"הצגת כל התשובות", none:"הסתרת כל התשובות",
      letters:["א.","ב.","ג."], archive:"📚 ארכיון החידונים", latest:"השבוע", empty:"החידונים של השבועות הקודמים יופיעו כאן.",
      old:"זהו חידון מהארכיון.", back:"לחידון של השבוע", err:"לא הצלחנו לטעון את החידון. נסו לרענן את העמוד.", date:"he-IL",
      dl:"📥 הורדת החידון ל־PDF", dlp:"4 עמודים, מוכן להדפסה – בחרו שפה:", saving:"מכינים את הקובץ…", saved:"הקובץ נשמר ✓",
      declined:"ההורדה בוטלה.", dlfail:"ההורדה לא הצליחה. נסו שוב בעוד רגע.", dlext:"הכפתורים יפתחו את האתר הציבורי בלשונית חדשה – שם ההורדה מיידית:",
      wa:"💬 הצטרפו לקהילת הווטסאפ", wap:"כל שבוע – החידון החדש ישר לטלפון", wab:"הצטרפות לקהילה",
      play:"🎮 עונים וצוברים נקודות!", reset:"🔄 מההתחלה", resetq:"למחוק את הניקוד ולהתחיל מחדש?",
      peek:"👀 חשבתם? הצצה לתשובה", knew:"ידעתי! 😎", didnt:"לא הפעם 🙈", plus:n=>`+${n} נק׳`, ptsName:"נקודות",
      yes:["יש! 🎉","אלופים! 🏆","וואו, איזה ראש! 🧠","בול! 🎯","נכון מאוד! אפילו הגמל מוחא כפיים 🐪👏","מושלם! תנו כיף ✋","גאונים! 🤓","פצצה! 💥"],

      lvlDone:n=>`🎉 סיימתם את שלב ${n}! קדימה לשלב הבא 🚀`,
      tiers:[[.9,"🏆 גאוני הפרשה!","מושלם – אפשר להעביר שיעור על הפרשה 😎"],[.7,"🌟 כוכבי השולחן!","כמעט הכול נכון – כל הכבוד!"],[.4,"😎 בדרך הנכונה!","עוד קצת ואתם שם 💪"],[0,"🐣 אפרוחים מתוקים!","בשבוע הבא אנחנו טורפים את החידון 😄"]],
      share:"📲 לשתף את התוצאה בווטסאפ", again:"🔄 לשחק שוב",
      comm:"🏆 לשתף את הניקוד בקהילה", copied:"📋 הטקסט הועתק – הדביקו בקבוצה ושלחו!",

      old:"Ceci est un quiz des archives.", back:"Revenir au quiz de la semaine", err:"Le quiz n'a pas pu être chargé. Essayez de rafraîchir la page.", date:"fr-FR",

      yes:["Bravo ! 🎉","Champions ! 🏆","Quelle tête ! 🧠","Dans le mille ! 🎯","Exact ! Même le chameau applaudit 🐪👏","Parfait ! Tape m'en cinq ✋","Génial ! 🤓","Trop fort ! 💥"],

const app = document.getElementById("app");
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let manifest = null, cache = {}, lang = store.get("lang") || "he", slug = null;

// hash tokens: "vayera", "fr", "he", "vayera-fr"
function readHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return false;
  const m = h.match(/^(?:([a-z0-9_]+?))?(?:-?(he|fr))?$/);
  if(!m) return false;
  if(m[1] && m[1]!=="he" && m[1]!=="fr") slug = m[1];
  if(m[2]) lang = m[2]; else if(m[1]==="he"||m[1]==="fr") lang = m[1];
  return true;
}
readHash();
window.addEventListener("hashchange", ()=>{ if(readHash() && manifest) render().then(()=>window.scrollTo({top:0})); });

function rich(s){
  return String(s)
    .replaceAll("<he>",'<span class="he" dir="rtl" lang="he">').replaceAll("</he>","</span>")
    .replaceAll("<src>",'<span class="src" dir="rtl" lang="he">').replaceAll("</src>","</span>")
    .replaceAll("<tr>",'<span class="gloss">').replaceAll("</tr>","</span>");
}
function el(tag, attrs, html){ const e=document.createElement(tag); for(const k in (attrs||{})) e.setAttribute(k, attrs[k]); if(html!=null) e.innerHTML=html; return e; }
function fmtDate(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString(UI[lang].date,{day:"numeric",month:"long",year:"numeric"}) }catch(e){ return d } }

async function getIssue(s){
  if(cache[s]) return cache[s];
  const meta = manifest.issues.find(i=>i.slug===s);
  const r = await fetch(meta.file); if(!r.ok) throw new Error(r.status);
  return cache[s] = await r.json();
}

function setLangUI(){
  const u = UI[lang];
  document.documentElement.lang = lang; document.documentElement.dir = u.dir;
  for(const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.l===lang ? "true" : "false");
}

async function render(){
  setLangUI();
  const u = UI[lang];
  const issues = [...manifest.issues].sort((a,b)=>b.series-a.series);
  const latest = issues[0];
  const meta = issues.find(i=>i.slug===slug) || latest;
  let d;
  try { d = await getIssue(meta.slug); } catch(e){ app.innerHTML = `<div class="empty">${u.err}</div>`; return; }
  const t = d[lang];
  app.innerHTML = "";

  if(meta.slug !== latest.slug){
    const n = el("div",{class:"oldnote"}, `<span>${u.old}</span>`);
    const b = el("button",{type:"button"}, u.back); b.onclick = ()=>go(null); n.append(b); app.append(n);
  }

  app.append(el("section",{class:"hero"},
    `<span class="series">${u.series} <b>${d.series}</b> · ${fmtDate(d.date)}</span>
     <div class="kicker">${t.kicker} · ${u.parasha} ${t.parasha} · ${lang==="he"?d.year_he:d.year}</div>
     <h1>${t.title}</h1><div class="emo" aria-hidden="true">${t.emoji}</div><div class="sub">${t.sub}</div>`));

  app.append(waCard());
  if(meta.pdf){ const dl = el("section",{class:"dl",id:"dl","aria-labelledby":"dl-title"}); app.append(dl); fillDl(meta); }

  app.append(el("details",{class:"how", open:""}, `<summary>${u.how}</summary><ul>${t.how.map(x=>`<li>${x}</li>`).join("")}</ul>`));

  const nav = el("nav",{class:"nav","aria-label":u.lvl});
  t.levels.forEach((L,i)=>{
    const b = el("button",{type:"button",style:`background:${LV[i].c}`}, `${LV[i].i} ${u.lvl} ${i+1}<small>${u.pts(i+1)}</small>`);
    b.onclick = ()=>document.getElementById("lvl"+(i+1)).scrollIntoView({block:"start"});
    nav.append(b);
  });
  app.append(nav);

  // Game: tap an option (multiple choice) or peek + "I knew it" (open questions); level n is worth n points, the golden question 10.
  // Progress is kept per quiz and language in this browser.
  const game = loadGame(meta.slug), save = ()=>store.set(gkey(meta.slug), JSON.stringify(game));
  const total = t.questions.length, maxPts = t.questions.reduce((s,_,i)=>s+qPts(i+1),0);
  const tools = el("div",{class:"tools"}, `<span class="play">${u.play}</span>`);
  const rb = el("button",{type:"button"}, u.reset);
  rb.onclick = ()=>{ if(confirm(u.resetq)){ store.set(gkey(meta.slug),"{}"); render(); } };
  tools.append(rb); app.append(tools);
  const refresh = ()=>updateChip(game, total, maxPts, t.parasha, meta.slug);
  refresh();

  t.levels.forEach((L,li)=>{
    const sec = el("section",{class:"level",id:"lvl"+(li+1),style:`--lc:${LV[li].c}`});
    sec.append(el("div",{class:"lhead"}, `<div class="lico" aria-hidden="true">${LV[li].i}</div><div><div class="lname">${u.lvl} ${li+1} · ${L.name}</div><div class="lage">${L.age}</div></div><div class="stars" aria-hidden="true">${"⭐".repeat(li+1)}</div>`));
    t.questions.slice(li*10, li*10+10).forEach((Q,k)=>{
      const n = li*10+k+1, pts = qPts(n);
      const card = el("article",{class:"q"+(n===50?" gold":""),id:"q"+n});
      const body = el("div",{class:"qb"}, `<div class="qt">${rich(Q.q)}</div>`);
      const ans = el("div",{class:"ans"}, `<b>${rich(Q.a)}</b><span class="x">${rich(Q.x)}</span>`);
      const fb = el("div",{class:"fb","aria-live":"polite"});
      ans.hidden = fb.hidden = true;
      let lock;  // disables this question's controls once answered
      const finish = (ok, p, ev)=>{
        lock(p); ans.hidden = fb.hidden = false;
        fb.className = "fb " + (ok?"ok":"no");
        fb.innerHTML = ev ? `${pick(ok?u.yes:u.no)}${ok?` <b>${u.plus(pts)}</b>`:""}` : (ok?`✅ <b>${u.plus(pts)}</b>`:"❌");
        if(!ev) return;
        game[n] = {ok, p}; save(); refresh();
        if(ok){ burst(ev.clientX, ev.clientY, pts); } else { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
        const lvlDone = t.questions.slice(li*10, li*10+10).every((_,j)=>game[li*10+j+1]);
        if(Object.keys(game).length === total){ setTimeout(()=>{ const f = finalCard(d, t, game, maxPts, meta.slug); byeEl.after(f); f.scrollIntoView({block:"center"}); party();
          try{ window.goatcounter?.count?.({path:`finish-${meta.slug}-${lang}`, title:"Finished quiz", event:true}); }catch(e){} }, 700); }
        else if(lvlDone) toast(u.lvlDone(li+1));
      };
      if(Q.opts && Number.isInteger(Q.c)){
        const box = el("div",{class:"opts play"});
        const btns = Q.opts.map((o,j)=>{ const b = el("button",{type:"button",class:"opt"}, `<b>${u.letters[j]}</b> ${rich(o)}`); b.onclick = e=>{ if(!game[n]) finish(j===Q.c, j, e); }; box.append(b); return b; });
        lock = p=>btns.forEach((b,j)=>{ b.disabled = true; if(j===Q.c) b.classList.add("right"); else if(j===p) b.classList.add("wrong"); });
        body.append(box, fb, ans);
      } else {
        if(Q.opts) body.append(el("div",{class:"opts"}, Q.opts.map((o,j)=>`<span><b>${u.letters[j]}</b> ${rich(o)}</span>`).join("")));
        const peek = el("button",{type:"button",class:"reveal"}, u.peek);
        const judge = el("div",{class:"judge"}); judge.hidden = true;
        const yes = el("button",{type:"button",class:"knew"}, u.knew), no = el("button",{type:"button",class:"didnt"}, u.didnt);
        yes.onclick = e=>finish(true, null, e); no.onclick = e=>finish(false, null, e);
        judge.append(yes, no);
        peek.onclick = ()=>{ peek.hidden = true; ans.hidden = false; judge.hidden = false; };
        lock = ()=>{ peek.hidden = true; judge.hidden = true; };
        body.append(peek, ans, judge, fb);
      }
      if(game[n]) finish(game[n].ok, game[n].p);
      card.append(el("div",{class:"num","aria-hidden":"true"}, n), body);
      sec.append(card);
    });
    app.append(sec);
  });

  const byeEl = el("div",{class:"bye"}, t.bye);
  app.append(byeEl);
  if(Object.keys(game).length === total) app.append(finalCard(d, t, game, maxPts, meta.slug));
  app.append(waCard());

  const arc = el("section",{class:"archive"}, `<h2>${u.archive}</h2>`);
  const list = el("div",{class:"alist"});
  const past = issues.filter(i=>i.slug!==latest.slug);
  if(!past.length) list.append(el("div",{class:"empty"}, u.empty));
  for(const i of [latest, ...past]){
    if(i===latest && !past.length) continue;
    const c = el("button",{type:"button",class:"acard"+(i.slug===meta.slug?" cur":"")},
      `<span class="no">${i.series}</span><span><span class="t">${u.parasha} ${i[lang]}</span><br><span class="d">${fmtDate(i.date)}</span></span>${i.slug===latest.slug?`<span class="pill">${u.latest}</span>`:""}`);
    c.onclick = ()=>go(i.slug===latest.slug?null:i.slug);
    list.append(c);
  }
  arc.append(list); app.append(arc);
}

const WA_URL = "https://chat.whatsapp.com/JjmPtZj7JYe0aMiUDLhqjE";
const SCORES_URL = "https://chat.whatsapp.com/BUeEiECsc5NAk09FRHBfrL";  // "our scores" group inside the community
function waCard(){
  const u = UI[lang];
  return el("section",{class:"wa"}, `<div class="wt"><h2>${u.wa}</h2><p>${u.wap}</p></div><a href="${WA_URL}" target="_blank" rel="noopener">${u.wab}</a>`);
}

// ---- game helpers ----
const gkey = s=>`game:${s}:${lang}`;
function loadGame(s){ try{ return JSON.parse(store.get(gkey(s)) || "{}") || {}; }catch(e){ return {}; } }
const qPts = n=>n===50 ? 10 : Math.ceil(n/10);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

const chip = el("button",{type:"button",class:"chip","aria-live":"polite"});
chip.hidden = true;
document.body.append(chip);
// share button next to the score: shows once something is answered, opens a sheet with the share buttons
const fab = el("button",{type:"button",class:"fab"});
fab.hidden = true;
document.body.append(fab);
function openSheet(score, maxPts, answered, total, parasha, slug){
  const u = UI[lang];
  const back = el("div",{class:"sheetbg"});
  const box = el("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":u.myScore},
    `<div class="big">${u.myScore}</div><div class="score">⭐ ${score} <small>· ${answered}/${total}</small></div>`);
  const close = el("button",{type:"button",class:"x","aria-label":u.close}, "✕");
  const shut = ()=>{ back.remove(); box.remove(); document.removeEventListener("keydown", esc); fab.focus(); };
  const esc = e=>{ if(e.key==="Escape") shut(); };
  close.onclick = back.onclick = shut;
  document.addEventListener("keydown", esc);
  const row = el("div",{class:"frow"}), [cm, sh, note] = shareBits(score, maxPts, answered, total, parasha, slug);
  row.append(cm, sh); box.append(close, row, note);
  document.body.append(back, box); cm.focus();
}
function shareBits(score, maxPts, answered, total, parasha, slug){
  const u = UI[lang];
  const share = `${u.shareText(score, maxPts, parasha, answered, total)} ${PUBLIC_URL}?ref=score#${slug}-${lang}`;
  const sh = el("a",{class:"share",href:"https://wa.me/?text="+encodeURIComponent(share),target:"_blank",rel:"noopener"}, u.share);
  sh.onclick = ()=>{ try{ window.goatcounter?.count?.({path:`share-score-${slug}-${lang}`, title:"Share score", event:true}); }catch(e){} };
  // a link can't drop text into a group, so copy the message and open the scores group to paste it
  const note = el("div",{class:"cnote","aria-live":"polite"});
  const cm = el("a",{class:"comm",href:SCORES_URL,target:"_blank",rel:"noopener"}, u.comm);
  cm.onclick = ()=>{
    try{ navigator.clipboard?.writeText(share).then(()=>{ note.textContent = u.copied; }, ()=>{}); }catch(e){}
    try{ window.goatcounter?.count?.({path:`share-community-${slug}-${lang}`, title:"Share score in community", event:true}); }catch(e){}
  };
  return [cm, sh, note];
}
function updateChip(game, total, maxPts, parasha, slug){
  const ks = Object.keys(game), score = ks.reduce((s,k)=>s+(game[k].ok?qPts(+k):0),0);
  fab.hidden = !ks.length;
  fab.textContent = UI[lang].fab;
  fab.onclick = ()=>openSheet(score, maxPts, ks.length, total, parasha, slug);
  chip.hidden = false;
  chip.innerHTML = `⭐ <b>${score}</b> <small>${ks.length}/${total}</small>`;
  chip.setAttribute("aria-label", `${score} ${UI[lang].ptsName} · ${ks.length}/${total}`);
  chip.onclick = ()=>{ for(let n=1;n<=total;n++) if(!game[n]){ document.getElementById("q"+n)?.scrollIntoView({block:"center"}); return; } };
  if(!calm){ chip.classList.remove("pop"); void chip.offsetWidth; chip.classList.add("pop"); }
}
function burst(x, y, pts){
  if(calm) return;
  if(pts){
    const plus = el("div",{class:"plus",style:`left:${x}px;top:${y}px`}, UI[lang].plus(pts));
    document.body.append(plus); setTimeout(()=>plus.remove(), 1100);
  }
  for(let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2, r = 50+Math.random()*70;
    const s = el("span",{class:"bit",style:`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-30}px`}, pick(["🎉","⭐","✨","🍬","💫","🎈"]));
    document.body.append(s); setTimeout(()=>s.remove(), 1000);
  }
}
function party(){ for(let i=0;i<6;i++) setTimeout(()=>burst(40+Math.random()*(innerWidth-80), 120+Math.random()*(innerHeight/2), 0), i*180); }
let toastEl = null;
function toast(msg){
  toastEl?.remove();
  toastEl = el("div",{class:"toast",role:"status"}, msg);
  document.body.append(toastEl); setTimeout(()=>toastEl?.remove(), 2600);
}
function finalCard(d, t, game, maxPts, slug){
  const u = UI[lang], score = Object.keys(game).reduce((s,k)=>s+(game[k].ok?qPts(+k):0),0), pct = score/maxPts;
  const [title, line] = u.tiers.find(x=>pct >= x[0]).slice(1);
  const n = Object.keys(game).length;
  const c = el("section",{class:"final"}, `<div class="big">${title}</div><div class="score">${score} <small>/ ${maxPts}</small></div><p>${line}</p>`);
  const row = el("div",{class:"frow"}), [cm, sh, note] = shareBits(score, maxPts, n, n, t.parasha, slug);
  const ag = el("button",{type:"button"}, u.again);
  ag.onclick = ()=>{ store.set(gkey(slug),"{}"); render().then(()=>window.scrollTo({top:0})); };
  row.append(cm, sh, ag); c.append(row, note);
  return c;
}

// PDF downloads, three ways:
//  "link" – the public site (GitHub Pages): plain download links
//  "save" – inside Claude with the save prompt available
//  "ext"  – inside Claude without it (signed-out visitor): open the public site, where the link works
const PUBLIC_URL = "https://figaro6.github.io/parasha/";
let downloads = null, dlMode = window.claude?.use ? null : "link", dlMeta = null;
function setDlMode(m){ dlMode = m; document.body.classList.toggle("can-dl", !!m); if(dlMeta) fillDl(dlMeta); }
setDlMode(dlMode);
window.claude?.use?.("downloads").then(ns=>{ downloads = ns; setDlMode(ns ? "save" : (PUBLIC_URL ? "ext" : null)); })
  .catch(()=>setDlMode(PUBLIC_URL ? "ext" : null));
function fillDl(meta){
  dlMeta = meta;
  const box = document.getElementById("dl"); if(!box) return;
  const u = UI[lang];
  box.innerHTML = `<h2 id="dl-title">${u.dl}</h2><p>${dlMode==="ext" ? u.dlext : u.dlp}</p>`;
  const row = el("div",{class:"dlrow"}), msg = el("div",{class:"dlmsg","aria-live":"polite"});
  for(const [l, label] of [["he","PDF עברית"],["fr","PDF Français"]]){
    if(!meta.pdf[l]) continue;
    let b;
    if(dlMode==="save"){ b = el("button",{type:"button",id:"dl-"+l,lang:l}, label); b.onclick = ()=>savePdf(meta, l, b, msg); }
    else if(dlMode==="ext"){ b = el("a",{id:"dl-"+l,lang:l,href:`${PUBLIC_URL}#${meta.slug}-${l}`,target:"_blank",rel:"noopener"}, label); }
    else { b = el("a",{id:"dl-"+l,lang:l,href:meta.pdf[l],download:meta.pdf[l].split("?")[0].split("/").pop()}, label); b.onclick = ()=>countDl(meta.slug, l); }
    row.append(b);
  }
  box.append(row, msg);
  if(dlMode==="link") showDlCount(meta.slug, box);
}

// Stats (GoatCounter, no cookies): page visits + one event per PDF download.
// The public count only shows once "Allow adding visitor counts" is ticked in GoatCounter's settings.
const GC = "https://ourimad-parasha.goatcounter.com";
const dlPath = (s, l)=>`download-${s}-${l}`;
function countDl(s, l){ try{ window.goatcounter?.count?.({path: dlPath(s, l), title: `PDF ${s} ${l}`, event: true}); }catch(e){} }
async function showDlCount(s, box){
  try{
    const n = await Promise.all(["he","fr"].map(l=>fetch(`${GC}/counter/${dlPath(s, l)}.json`)
      .then(r=>r.ok ? r.json() : {count:"0"}).then(j=>parseInt(String(j.count).replace(/\D/g,""))||0).catch(()=>0)));
    const total = n[0]+n[1];
    if(!total || !box.isConnected) return;
    box.append(el("div",{class:"dlmsg"}, lang==="he" ? `📊 הורד ${total.toLocaleString("he-IL")} פעמים` : `📊 Téléchargé ${total.toLocaleString("fr-FR")} fois`));
  }catch(e){}
}
async function savePdf(meta, l, btn, msg){
  const u = UI[lang];
  if(!downloads) return;
  btn.disabled = true; msg.textContent = u.saving;
  try{
    const r = await fetch(meta.pdf[l]); if(!r.ok) throw {code:"fetch"};
    const blob = await r.blob();
    await downloads.save({filename: meta.pdf[l].split("?")[0].split("/").pop(), data: blob});
    msg.textContent = u.saved;
  }catch(e){
    if(e && ["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)){ document.body.classList.remove("can-dl"); }
    msg.textContent = e && e.code==="declined" ? u.declined : u.dlfail;
  }finally{ btn.disabled = false; }
}

function go(s){ slug = s; render().then(()=>window.scrollTo({top:0})); }
for(const b of document.querySelectorAll(".lang button")) b.onclick = ()=>{ lang=b.dataset.l; store.set("lang",lang); render(); };

fetch("data/manifest.json").then(r=>r.json()).then(m=>{ manifest=m; render(); })
  .catch(()=>{ app.innerHTML = `<div class="empty">${UI[lang].err}</div>`; });
</script>
